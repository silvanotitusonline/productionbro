name: Android Production Verification

on:
  push:
    branches: [ main, production, develop ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  GRADLE_VERSION: '8.13'

jobs:
  verify-android:
    name: Compile, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Google retired the legacy `tools` package (sdkmanager can no longer
      # resolve it). Default packages for setup-android@v4 still include it,
      # so pin an explicit set that excludes `tools`.
      # See: https://github.com/android-actions/setup-android/issues/537
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        shell: bash
        run: |
          # `yes` receives SIGPIPE after sdkmanager consumes the final license response.
          # Disable pipefail only for that expected acceptance pipeline.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Verify Android SDK and Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -x ./gradlew
          test -n "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -d "$sdk_root/platforms/android-36"
          test -d "$sdk_root/build-tools/35.0.0"
          ./gradlew --version

      - name: Restore production runtime for verification and distributable APKs
        env:
          RTC_PROD_SUPABASE_URL: ${{ secrets.RTC_PROD_SUPABASE_URL }}
          RTC_PROD_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.RTC_PROD_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          if [ -z "$RTC_PROD_SUPABASE_URL" ] || [ -z "$RTC_PROD_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::notice::Production runtime secrets are not configured. Using tracked production publishable configuration."
            exit 0
          fi
          umask 077
          {
            printf 'supabase.production.url=%s\n' "$RTC_PROD_SUPABASE_URL"
            printf 'supabase.production.publishableKey=%s\n' "$RTC_PROD_SUPABASE_PUBLISHABLE_KEY"
          } > runtime.local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install source-contract Python dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input Pillow==11.3.0

      - name: Restore Firebase Android configuration when supplied
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            umask 077
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "Firebase Android configuration restored for this CI run."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 is not configured."
            echo "Debug compile will continue with Google Services intentionally not applied."
          fi

      - name: Run source regression contracts
        run: python3 tools/tests/run_contract_tests.py

      - name: Validate Supabase RPC authorization manifest
        run: python3 tools/security/verify_rpc_authorization_manifest.py

      - name: Run release gate artifact verification
        run: ./tools/tests/run_release_gate.sh

      - name: Run shared Edge authorization tests
        run: deno test supabase/functions/_shared/auth_test.ts

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Compile Compose smoke tests
        run: ./gradlew --no-daemon --stacktrace assembleDebugAndroidTest

      - name: Reclaim runner disk for Android emulator userdata
        shell: bash
        run: |
          set -euo pipefail
          # API 36 creates a ~7.2 GB userdata image. The hosted runner has only ~4.3 GB
          # left after its preinstalled developer stacks and the Android build cache.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf "$ANDROID_SDK_ROOT/ndk" "$ANDROID_SDK_ROOT/cmake"
          docker system prune --all --force || true
          df -h "$HOME" "$ANDROID_SDK_ROOT"

      - name: Run Android instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # GitHub-hosted runners may have less than the emulator default 7.2 GB userdata
          # allocation available after SDK/Gradle setup. A 2 GB disposable test partition is
          # ample for the app and instrumentation APKs, and prevents an AVD boot timeout.
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-snapshot-save -partition-size 2048
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Upload debug verification artifacts
        if: always()
        # GitHub artifact quota exhaustion must not obscure a completed test result.
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: rtc-community-debug-verification
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/**

      - name: Assemble release candidate when complete configuration exists
        env:
          RTC_PROD_SUPABASE_URL: ${{ secrets.RTC_PROD_SUPABASE_URL }}
          RTC_PROD_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.RTC_PROD_SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          RTC_ANDROID_KEYSTORE_BASE64: ${{ secrets.RTC_ANDROID_KEYSTORE_BASE64 }}
          RTC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RTC_ANDROID_KEYSTORE_PASSWORD }}
          RTC_ANDROID_KEY_ALIAS: ${{ secrets.RTC_ANDROID_KEY_ALIAS }}
          RTC_ANDROID_KEY_PASSWORD: ${{ secrets.RTC_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          required=(
            RTC_PROD_SUPABASE_URL
            RTC_PROD_SUPABASE_PUBLISHABLE_KEY
            GOOGLE_SERVICES_JSON_BASE64
            RTC_ANDROID_KEYSTORE_BASE64
            RTC_ANDROID_KEYSTORE_PASSWORD
            RTC_ANDROID_KEY_ALIAS
            RTC_ANDROID_KEY_PASSWORD
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::notice::Release-candidate build skipped because the complete release secret bundle is not configured: ${missing[*]}"
            exit 0
          fi

          umask 077
          {
            printf 'supabase.production.url=%s\n' "$RTC_PROD_SUPABASE_URL"
            printf 'supabase.production.publishableKey=%s\n' "$RTC_PROD_SUPABASE_PUBLISHABLE_KEY"
          } > release.runtime.properties

          printf '%s' "$RTC_ANDROID_KEYSTORE_BASE64" | base64 --decode > rtc-ci-release.keystore
          export RTC_ANDROID_KEYSTORE_PATH="$GITHUB_WORKSPACE/rtc-ci-release.keystore"

          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Upload release candidate artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rtc-community-release-candidate
          if-no-files-found: ignore
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Cleanup reconstructed CI credentials
        if: always()
        shell: bash
        run: |
          rm -f \
            runtime.local.properties \
            release.runtime.properties \
            signing.properties \
            rtc-ci-release.keystore \
            app/google-services.json
