name: RTC Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-gate:
    name: Contracts, security, SQL artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-contract Python dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input Pillow==11.3.0
      - name: Run release gate
        run: ./tools/tests/run_release_gate.sh
